<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>Extrude Tilt</title>
<style>
  :root { --fg:#f4f4f6; --muted:rgba(244,244,246,.62); --accent:#ff5a36; --glass:rgba(22,22,28,.55); --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0b0f; color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--muted); pointer-events:none; padding:6px 12px; border-radius:999px;
    background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line);
    white-space:nowrap; transition:opacity .3s; }
  .ui { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom));
    width:min(640px, calc(100% - 20px)); display:flex; flex-direction:column; gap:8px; padding:10px;
    background:var(--glass); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--line); border-radius:22px; }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .label { flex:none; align-self:center; font-size:11px; color:var(--muted); width:30px; }
  .chip { flex:none; display:flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:999px;
    padding:5px 11px 5px 5px; background:rgba(255,255,255,.06); color:var(--fg); font-size:12.5px; cursor:pointer; transition:background .2s; }
  .chip:hover { background:rgba(255,255,255,.1); }
  .chip i { width:18px; height:18px; border-radius:50%; display:block; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .chip.on { border-color:var(--accent); background:rgba(255,90,54,.14); }
  .row { display:flex; justify-content:center; gap:8px; }
  .btn { border:0; border-radius:999px; padding:8px 15px; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,.08); color:var(--fg); cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; }
  input[type=file] { display:none; }
  .drop { position:fixed; inset:12px; border:2px dashed var(--accent); border-radius:22px; display:none;
    align-items:center; justify-content:center; font-size:18px; font-weight:600; color:#fff;
    background:rgba(255,90,54,.12); backdrop-filter:blur(4px); pointer-events:none; }
  body.dragging .drop { display:flex; }
  .touch-only { display:none; }
  body.touch .touch-only { display:inline-block; }
</style>
</head>
<body>
<div class="hint" id="hint"></div>
<div class="drop">여기에 놓으면 바로 3D로 바뀌어요</div>
<div class="ui">
  <div class="chips"><span class="label">재질</span><div class="chips" id="mats"></div></div>
  <div class="chips"><span class="label">배경</span><div class="chips" id="envs"></div></div>
  <div class="row">
    <label class="btn primary" for="file">이미지 선택</label>
    <button class="btn touch-only" id="tilt">기울기 켜기</button>
  </div>
  <input id="file" type="file" accept=".svg,.png,.webp,.jpg,.jpeg,image/svg+xml,image/png,image/webp,image/jpeg">
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode,
         VignetteEffect, NoiseEffect, BlendFunction } from 'postprocessing';

const DEPTH_RATIO = 0.24;        // 두께 = 형태 크기의 24%
const GROUND_Y = -2.55;
const HDR = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r169/examples/textures/equirectangular/';
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const hint = document.getElementById('hint');
const DEFAULT_HINT = isTouch ? 'SVG·PNG·WebP를 올리고 폰을 기울여보세요' : 'SVG·PNG·WebP 파일을 끌어다 놓으세요 · 드래그로 회전';
const setHint = t => hint.textContent = t;
setHint(DEFAULT_HINT);

// ---------- renderer / composer ----------
const renderer = new THREE.WebGLRenderer({ powerPreference:'high-performance', antialias:false, stencil:false, depth:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;           // 톤매핑은 후처리(AgX)에서
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 200);

const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType, multisampling: 4 });
composer.addPass(new RenderPass(scene, camera));
const grain = new NoiseEffect({ blendFunction: BlendFunction.OVERLAY, premultiply:true });
grain.blendMode.opacity.value = 0.06;   // 아주 약한 필름 그레인
composer.addPass(new EffectPass(camera,
  new BloomEffect({ mipmapBlur:true, luminanceThreshold:0.8, luminanceSmoothing:0.25, intensity:0.55, radius:0.7 }),
  new ToneMappingEffect({ mode: ToneMappingMode.AGX }),
  new VignetteEffect({ offset:0.28, darkness:0.6 }),
  grain,
));

// ---------- 조명 & 바닥 그림자 ----------
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2.5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-5, right:5, top:5, bottom:-5, near:1, far:25 });
sun.shadow.radius = 14; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity:0.38 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = GROUND_Y; ground.receiveShadow = true;
scene.add(ground);

const pivot = new THREE.Group(); scene.add(pivot);
let current = null, spawnT = 0;

// ---------- 배경 / 환경맵 ----------
function gradientTex(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const ENVS = [
  { id:'studio', name:'스튜디오', file:'royal_esplanade_1k.hdr', bg: gradientTex('#3a3a44', '#0d0d12'), swatch:'linear-gradient(#5a5a66,#15151b)', envI:1.0 },
  { id:'sunset', name:'노을',     file:'venice_sunset_1k.hdr',     blur:0.45, bgI:0.9, envI:1.0, swatch:'linear-gradient(#f6b38a,#5a4a6e)' },
  { id:'dawn',   name:'새벽',     file:'blouberg_sunrise_2_1k.hdr', blur:0.5,  bgI:0.9, envI:1.0, swatch:'linear-gradient(#ffd9a8,#7aa0c8)' },
  { id:'outdoor',name:'야외',     file:'quarry_01_1k.hdr',         blur:0.4,  bgI:0.85, envI:1.0, swatch:'linear-gradient(#bcd7f0,#8b8a78)' },
  { id:'city',   name:'도시',     file:'pedestrian_overpass_1k.hdr', blur:0.45, bgI:0.85, envI:1.0, swatch:'linear-gradient(#cfd6dc,#6f7680)' },
  { id:'hall',   name:'홀',       file:'royal_esplanade_1k.hdr',   blur:0.3,  bgI:0.8, envI:1.0, swatch:'linear-gradient(#e8d2b0,#6b5440)' },
];
const hdrCache = new Map();
const rgbe = new RGBELoader();
function loadHDR(file) {
  if (!hdrCache.has(file)) hdrCache.set(file, rgbe.loadAsync(HDR + file).then(t => { t.mapping = THREE.EquirectangularReflectionMapping; return t; }));
  return hdrCache.get(file);
}
let envToken = 0;
async function applyEnv(env) {
  document.querySelectorAll('#envs .chip').forEach(b => b.classList.toggle('on', b.dataset.id === env.id));
  const token = ++envToken;
  setHint('배경 불러오는 중…');
  try {
    const tex = await loadHDR(env.file);
    if (token !== envToken) return;
    scene.environment = tex;
    scene.environmentIntensity = env.envI;
    if (env.bg) { scene.background = env.bg; scene.backgroundBlurriness = 0; scene.backgroundIntensity = 1; }
    else { scene.background = tex; scene.backgroundBlurriness = env.blur; scene.backgroundIntensity = env.bgI; }
    setHint(DEFAULT_HINT);
  } catch (e) {
    setHint('배경을 불러오지 못했어요');
  }
}

// ---------- 재질 ----------
// keep: 원래 색/이미지 유지, color: 색 고정, glass: 투과 + 원래 색으로 물들임
const MATERIALS = [
  { id:'plastic', name:'원본',     swatch:'linear-gradient(135deg,#ff9a6c,#ff5a36)', p:{ roughness:0.32, clearcoat:0.4, clearcoatRoughness:0.2 } },
  { id:'ceramic', name:'세라믹',   swatch:'linear-gradient(135deg,#fff,#d9d4cc)', p:{ roughness:0.12, clearcoat:1, clearcoatRoughness:0.03 } },
  { id:'clay',    name:'클레이',   swatch:'#c9b8a6', p:{ roughness:0.9 } },
  { id:'velvet',  name:'벨벳',     swatch:'linear-gradient(135deg,#a0375a,#4a1028)', p:{ roughness:1, sheen:1, sheenRoughness:0.45 }, sheen:true },
  { id:'chrome',  name:'크롬',     swatch:'linear-gradient(135deg,#fff,#7d838f 45%,#f2f2f2 60%,#666)', color:'#ffffff', p:{ metalness:1, roughness:0.04 } },
  { id:'gold',    name:'골드',     swatch:'linear-gradient(135deg,#fff1b8,#d9a441 50%,#8a5a12)', color:'#ffcc66', p:{ metalness:1, roughness:0.14 } },
  { id:'rose',    name:'로즈골드', swatch:'linear-gradient(135deg,#ffe0d6,#d99a86 50%,#8a4c3e)', color:'#f2b4a0', p:{ metalness:1, roughness:0.18 } },
  { id:'glass',   name:'유리',     swatch:'linear-gradient(135deg,rgba(255,255,255,.95),rgba(150,200,255,.3))', glass:true, p:{ roughness:0, transmission:1, thickness:1.6, ior:1.5, dispersion:4, attenuationDistance:4 } },
  { id:'jelly',   name:'젤리',     swatch:'linear-gradient(135deg,#ffc2d4,#ff5f8f)', glass:true, p:{ roughness:0.18, transmission:0.95, thickness:3, ior:1.33, clearcoat:1, attenuationDistance:1.2 } },
  { id:'holo',    name:'홀로그램', swatch:'conic-gradient(#9ff,#f9f,#ff9,#9ff)', color:'#ffffff', p:{ metalness:0.9, roughness:0.08, iridescence:1, iridescenceIOR:1.5, iridescenceThicknessRange:[100, 900] } },
];
let currentMat = MATERIALS[0];

function makeMaterial(slot, preset) {
  const m = new THREE.MeshPhysicalMaterial({ ...preset.p });
  if (preset.glass) {
    m.color.set('#ffffff');
    m.attenuationColor.copy(slot.tint).lerp(new THREE.Color(1,1,1), 0.25);
  } else if (preset.color) {
    m.color.set(preset.color);
  } else {
    m.color.copy(slot.color);
    m.map = slot.map || null;
    if (preset.sheen) m.sheenColor.copy(slot.tint).lerp(new THREE.Color(1,1,1), 0.5);
  }
  return m;
}
function applyMaterial(preset) {
  currentMat = preset;
  document.querySelectorAll('#mats .chip').forEach(b => b.classList.toggle('on', b.dataset.id === preset.id));
  if (!current) return;
  current.traverse(o => {
    if (!o.isMesh || !o.userData.slots) return;
    [].concat(o.material || []).forEach(m => m.dispose());
    const mats = o.userData.slots.map(s => makeMaterial(s, preset));
    o.material = mats.length === 1 ? mats[0] : mats;
  });
}

function makeChips(el, list, onPick) {
  list.forEach(item => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.id = item.id;
    b.innerHTML = `<i style="background:${item.swatch}"></i>${item.name}`;
    b.onclick = () => onPick(item);
    el.appendChild(b);
  });
}
makeChips(document.getElementById('mats'), MATERIALS, applyMaterial);
makeChips(document.getElementById('envs'), ENVS, applyEnv);

// ---------- 지오메트리 ----------
function fitAndCenter(obj, target = 4) {
  const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  obj.scale.multiplyScalar(target / Math.max(size.x, size.y));
  const c = new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3());
  obj.position.sub(c);
}
function shapesSize(shapes) {
  const b = new THREE.Box2();
  shapes.forEach(s => s.getPoints(4).forEach(p => b.expandByPoint(p)));
  const s = b.getSize(new THREE.Vector2());
  return Math.max(s.x, s.y) || 1;
}

function buildFromSVG(text, raster) {
  const data = new SVGLoader().parse(text);
  const items = [];
  data.paths.forEach(path => {
    const fill = path.userData?.style?.fill;
    if (fill === 'none') return;
    const shapes = SVGLoader.createShapes(path);
    if (shapes.length) items.push({ shapes, color: new THREE.Color().setStyle(fill && fill !== 'none' ? fill : '#ffffff') });
  });
  if (!items.length) throw new Error('채워진 도형이 없는 SVG예요');
  const size = shapesSize(items.flatMap(i => i.shapes));
  const depth = size * DEPTH_RATIO;
  const group = new THREE.Group();
  items.forEach(({ shapes, color }) => {
    const geo = new THREE.ExtrudeGeometry(shapes, {
      depth, bevelEnabled:true, bevelThickness:depth * 0.07,
      bevelSize: size * (raster ? 0.005 : 0.01), bevelSegments:5, curveSegments:24,
    });
    const mesh = new THREE.Mesh(geo);
    mesh.castShadow = true;
    mesh.userData.slots = raster
      ? [{ color:new THREE.Color(1,1,1), map:raster.tex, tint:raster.edge }, { color:raster.edge, tint:raster.edge }]
      : [{ color, tint:color }];
    group.add(mesh);
  });
  group.scale.y = -1;
  const wrap = new THREE.Group(); wrap.add(group);
  fitAndCenter(wrap);
  return wrap;
}

function buildFromRaster(img) {
  const MAX = 320;
  const k = MAX / Math.max(img.width, img.height);
  const w = Math.max(2, Math.round(img.width * k)), h = Math.max(2, Math.round(img.height * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const solid = new Uint8Array(w * h);
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < w * h; i++) {
    if (px[i*4+3] >= 128) { solid[i] = 1; r += px[i*4]; g += px[i*4+1]; b += px[i*4+2]; n++; }
  }
  if (!n) throw new Error('불투명한 부분이 없는 이미지예요');
  const loops = traceContours(solid, w, h).map(l => chaikin(l, 2));
  const d = loops.map(l => 'M' + l.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z').join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><path fill="#fff" fill-rule="evenodd" d="${d}"/></svg>`;

  const tex = new THREE.Texture(img);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repeat.set(1 / w, -1 / h); tex.offset.set(0, 1);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); tex.needsUpdate = true;
  const edge = new THREE.Color().setRGB(r/n/255, g/n/255, b/n/255, THREE.SRGBColorSpace).multiplyScalar(0.85);
  return buildFromSVG(svg, { tex, edge });
}

function traceContours(solid, w, h) {
  const at = (x, y) => x >= 0 && y >= 0 && x < w && y < h && solid[y*w + x];
  const out = new Map();
  const add = (x1, y1, x2, y2) => { const kk = x1 + ',' + y1; (out.get(kk) || out.set(kk, []).get(kk)).push([x2, y2]); };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!solid[y*w + x]) continue;
    if (!at(x, y-1)) add(x, y, x+1, y);
    if (!at(x+1, y)) add(x+1, y, x+1, y+1);
    if (!at(x, y+1)) add(x+1, y+1, x, y+1);
    if (!at(x-1, y)) add(x, y+1, x, y);
  }
  const loops = [];
  for (const [startKey, list] of out) {
    while (list.length) {
      const [sx, sy] = startKey.split(',').map(Number);
      const pts = [[sx, sy]];
      let cur = list.pop();
      while (!(cur[0] === sx && cur[1] === sy)) {
        pts.push(cur);
        const next = out.get(cur[0] + ',' + cur[1]);
        if (!next || !next.length) break;
        cur = next.pop();
      }
      if (pts.length >= 4) {
        const s = simplify(pts, 0.8);
        if (s.length >= 3 && Math.abs(area(s)) >= 8) loops.push(s);
      }
    }
  }
  return loops;
}
function area(p) { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i+1) % p.length]; a += p[i][0]*q[1] - q[0]*p[i][1]; } return a / 2; }
function simplify(pts, eps) {
  let far = 0, fd = -1;
  for (let i = 1; i < pts.length; i++) { const dd = (pts[i][0]-pts[0][0])**2 + (pts[i][1]-pts[0][1])**2; if (dd > fd) { fd = dd; far = i; } }
  const a = rdp(pts.slice(0, far + 1), eps), b = rdp(pts.slice(far).concat([pts[0]]), eps);
  return a.slice(0, -1).concat(b.slice(0, -1));
}
function rdp(p, eps) {
  if (p.length < 3) return p;
  const [ax, ay] = p[0], [bx, by] = p[p.length - 1];
  const len = Math.hypot(bx - ax, by - ay) || 1;
  let idx = 0, md = 0;
  for (let i = 1; i < p.length - 1; i++) {
    const dd = Math.abs((bx - ax) * (ay - p[i][1]) - (ax - p[i][0]) * (by - ay)) / len;
    if (dd > md) { md = dd; idx = i; }
  }
  if (md <= eps) return [p[0], p[p.length - 1]];
  return rdp(p.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(p.slice(idx), eps));
}
// 계단 윤곽을 부드러운 곡선으로
function chaikin(p, iter) {
  for (let k = 0; k < iter; k++) {
    const q = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      q.push([a[0]*0.75 + b[0]*0.25, a[1]*0.75 + b[1]*0.25], [a[0]*0.25 + b[0]*0.75, a[1]*0.25 + b[1]*0.75]);
    }
    p = q;
  }
  return p;
}

function setObject(obj) {
  if (current) {
    pivot.remove(current);
    current.traverse(o => { o.geometry?.dispose(); [].concat(o.material || []).forEach(m => m.dispose()); });
  }
  current = obj; pivot.add(obj);
  applyMaterial(currentMat);
  target.x = target.y = 0;
  spawnT = performance.now();
}

// ---------- 파일 불러오기 ----------
async function loadFile(f) {
  if (!f) return;
  const name = f.name.toLowerCase();
  try {
    if (f.type === 'image/svg+xml' || name.endsWith('.svg')) {
      setObject(buildFromSVG(await f.text()));
    } else if (/^image\//.test(f.type) || /\.(png|webp|jpe?g)$/.test(name)) {
      const url = URL.createObjectURL(f);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      setObject(buildFromRaster(img));
    } else {
      throw new Error('SVG, PNG, WebP, JPG 파일만 돼요');
    }
    setHint(DEFAULT_HINT);
  } catch (e) {
    setHint('변환 실패: ' + (e.message || e));
  }
}
document.getElementById('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});

// ---------- 기울기 / 드래그 / 자동 흔들림 ----------
const target = { x:0, y:0 };
let base = null, tiltOn = false, lastInput = 0;
function onOrient(e) {
  if (e.beta == null) return;
  if (!base) base = { beta:e.beta, gamma:e.gamma };
  const clamp = v => Math.max(-45, Math.min(45, v));
  target.x = THREE.MathUtils.degToRad(clamp(e.beta - base.beta)) * 1.2;
  target.y = THREE.MathUtils.degToRad(clamp(e.gamma - base.gamma)) * 1.2;
}
const tiltBtn = document.getElementById('tilt');
tiltBtn.addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') { tiltBtn.textContent = '권한 거부됨'; return; }
    }
    base = null; tiltOn = true;
    addEventListener('deviceorientation', onOrient);
    tiltBtn.textContent = '기준 재설정';
  } catch { tiltBtn.textContent = '지원 안 됨'; }
});

let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, tx:target.x, ty:target.y }; lastInput = performance.now(); });
addEventListener('pointermove', e => { if (!drag) return;
  target.y = drag.ty + (e.clientX - drag.x) * 0.006;
  target.x = drag.tx + (e.clientY - drag.y) * 0.006;
  lastInput = performance.now(); });
addEventListener('pointerup', () => drag = null);

// ---------- 화면 크기에 맞춰 카메라 거리 조정 ----------
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(3.1 / t, 2.6 / (t * camera.aspect));
  camera.position.set(0, 0.6, dist);
  camera.lookAt(0, -0.55, 0);
  camera.updateProjectionMatrix();
}
fitCamera();
addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- 시작 ----------
applyMaterial(currentMat);
applyEnv(ENVS[0]);
setObject(buildFromSVG(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path fill="#ff5a36" d="M50 5 61 38 96 38 68 59 79 93 50 72 21 93 32 59 4 38 39 38Z"/></svg>`));

const clock = new THREE.Clock();
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime, now = performance.now();
  // 입력이 없으면 천천히 좌우로 흔들림
  const idle = !tiltOn && !drag && now - lastInput > 2500;
  const ix = idle ? Math.sin(t * 0.6) * 0.12 : 0, iy = idle ? Math.sin(t * 0.45) * 0.45 : 0;
  pivot.rotation.x += (target.x + ix - pivot.rotation.x) * 0.08;
  pivot.rotation.y += (target.y + iy - pivot.rotation.y) * 0.08;
  pivot.position.y = Math.sin(t * 1.3) * 0.06;
  const s = Math.min(1, (now - spawnT) / 650);
  pivot.scale.setScalar(0.6 + 0.4 * easeOutBack(s));
  scene.backgroundRotation.set(-pivot.rotation.x * 0.12, -pivot.rotation.y * 0.2, 0);   // 배경 시차
  composer.render(dt);
});
</script>
</body>
